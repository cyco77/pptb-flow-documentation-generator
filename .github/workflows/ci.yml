name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    name: Build and Quality Checks
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type checking
        run: pnpm exec tsc --noEmit

      - name: Build project
        run: pnpm build

      - name: Check build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed: dist directory not found"
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "Build failed: index.html not found in dist"
            exit 1
          fi
          echo "Build output verified successfully"

      - name: Upload build artifacts
        if: matrix.node-version == '24.x'
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 7

  lint:
    name: Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for linting setup
        run: |
          if [ -f ".eslintrc.json" ] || [ -f ".eslintrc.js" ] || [ -f "eslint.config.js" ]; then
            echo "ESLint configuration found, running linter..."
            pnpm run lint || echo "::warning::No lint script found in package.json"
          else
            echo "::notice::No ESLint configuration found, skipping linting"
          fi

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for known vulnerabilities
        run: |
          AUDIT_RESULT=$(pnpm audit --json || true)
          VULNERABILITIES=$(node -e 'try { console.log(JSON.parse(process.argv[1]).metadata?.vulnerabilities?.high ?? 0) } catch { console.log(0) }' "$AUDIT_RESULT")
          CRITICAL=$(node -e 'try { console.log(JSON.parse(process.argv[1]).metadata?.vulnerabilities?.critical ?? 0) } catch { console.log(0) }' "$AUDIT_RESULT")

          if [ "$CRITICAL" -gt "0" ]; then
            echo "::error::Found $CRITICAL critical vulnerabilities"
            exit 1
          elif [ "$VULNERABILITIES" -gt "0" ]; then
            echo "::warning::Found $VULNERABILITIES high-severity vulnerabilities"
          else
            echo "No high or critical vulnerabilities found"
          fi

  package-check:
    name: Package Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate package.json
        run: |
          node -e "
          const pkg = require('./package.json');
          const required = ['name', 'version', 'description', 'author', 'license'];
          const missing = required.filter(field => !pkg[field]);
          if (missing.length > 0) {
            console.error('Missing required fields:', missing.join(', '));
            process.exit(1);
          }
          console.log('package.json validation passed');
          "

      - name: Verify pnpm lockfile
        run: |
          if [ ! -f "pnpm-lock.yaml" ]; then
            echo "::error::pnpm-lock.yaml not found"
            exit 1
          fi
          echo "pnpm-lock.yaml found"

  changeset-check:
    name: Changeset Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changeset
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- .changeset | grep -Eq '^\.changeset/[a-z0-9-]+\.md$'; then
            echo "Changeset found"
          else
            echo "::error::Add a Changeset with 'pnpm changeset' for every pull request to dev"
            exit 1
          fi

  main-branch-policy:
    name: Main Branch PR Policy
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'

    steps:
      - name: Validate pull request source branch
        run: |
          if [ "${{ github.head_ref }}" != "dev" ] && [[ ! "${{ github.head_ref }}" =~ ^changeset-release/ ]]; then
            echo "::error::Pull requests to main must come from dev or an automated Changesets release branch"
            exit 1
          fi

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-and-test, lint, security, package-check, changeset-check, main-branch-policy]
    if: always()

    steps:
      - name: Check workflow status
        run: |
          if [ "${{ needs.build-and-test.result }}" != "success" ]; then
            echo "::error::Build and test job failed"
            exit 1
          fi
          if [ "${{ needs.lint.result }}" == "failure" ]; then
            echo "::warning::Lint job failed"
          fi
          if [ "${{ needs.security.result }}" == "failure" ]; then
            echo "::warning::Security audit job failed"
          fi
          if [ "${{ needs.package-check.result }}" != "success" ]; then
            echo "::error::Package validation job failed"
            exit 1
          fi
          if [ "${{ needs.changeset-check.result }}" == "failure" ]; then
            echo "::error::Changeset check failed"
            exit 1
          fi
          if [ "${{ needs.main-branch-policy.result }}" == "failure" ]; then
            echo "::error::Main branch policy check failed"
            exit 1
          fi
          echo "✅ All critical checks passed!"
